# cargo-deny: licences, advisories, bans and sources. Run with `cargo deny check`.

[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
# Each ignore needs a reason and a roadmap item. Review on every dependency update.
ignore = [
  # ttf-parser is unmaintained; we use it (and fontdb uses it) for v0 text outlines. Replaced by
  # skrifa when text moves to parley (docs/roadmap.md, ADR 0003).
  { id = "RUSTSEC-2026-0192", reason = "replace with skrifa via parley; tracked on the roadmap" },
  # zbus split crates, merged into zbus 6; pulled in transitively by rfd/accesskit. Clears when
  # those update to zbus 6.
  { id = "RUSTSEC-2026-0370", reason = "transitive via zbus 5 (rfd, accesskit); clears on zbus 6" },
  { id = "RUSTSEC-2026-0371", reason = "transitive via zbus 5 (rfd, accesskit); clears on zbus 6" },
  { id = "RUSTSEC-2026-0372", reason = "transitive via zbus 5 (rfd, accesskit); clears on zbus 6" },
]

[licenses]
version = 2
confidence-threshold = 0.9
# Permissive licences compatible with shipping Tellshot as MIT OR Apache-2.0.
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "ISC",
  "Zlib",
  "CC0-1.0",
  "Unicode-3.0",
  "Unlicense",
  "MPL-2.0",   # file-level copyleft; fine to link from a permissive app
  "OFL-1.1",   # fonts
  "CDLA-Permissive-2.0",
]

# Slint is offered as GPL-3.0-only OR its Royalty-free 2.0 licence OR a commercial licence.
# Tellshot takes the Royalty-free option, which requires showing the AboutSlint credit in the
# About window (see docs/adr/0002-ui-toolkit-slint.md). The GPL option is never accepted.
[[licenses.exceptions]]
crate = "i-slint-backend-selector"
allow = ["LicenseRef-Slint-Royalty-free-2.0"]

[[licenses.exceptions]]
crate = "i-slint-backend-winit"
allow = ["LicenseRef-Slint-Royalty-free-2.0"]

[[licenses.exceptions]]
crate = "i-slint-common"
allow = ["LicenseRef-Slint-Royalty-free-2.0"]

[[licenses.exceptions]]
crate = "i-slint-compiler"
allow = ["LicenseRef-Slint-Royalty-free-2.0"]

[[licenses.exceptions]]
crate = "i-slint-core"
allow = ["LicenseRef-Slint-Royalty-free-2.0"]

[[licenses.exceptions]]
crate = "i-slint-core-macros"
allow = ["LicenseRef-Slint-Royalty-free-2.0"]

[[licenses.exceptions]]
crate = "i-slint-renderer-skia"
allow = ["LicenseRef-Slint-Royalty-free-2.0"]

[[licenses.exceptions]]
crate = "i-slint-renderer-software"
allow = ["LicenseRef-Slint-Royalty-free-2.0"]

[[licenses.exceptions]]
crate = "slint"
allow = ["LicenseRef-Slint-Royalty-free-2.0"]

[[licenses.exceptions]]
crate = "slint-build"
allow = ["LicenseRef-Slint-Royalty-free-2.0"]

[[licenses.exceptions]]
crate = "slint-macros"
allow = ["LicenseRef-Slint-Royalty-free-2.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Internal crates are path dependencies of unpublished packages.
allow-wildcard-paths = true
highlight = "all"
deny = [
  # Prefer rustls everywhere; native OpenSSL complicates cross-platform packaging.
  { crate = "openssl-sys", reason = "use rustls" },
  { crate = "openssl", reason = "use rustls" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
