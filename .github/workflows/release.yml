name: Release

# Builds and packages Tellshot for every platform.
# - Every push to main (and PRs that touch packaging) builds all installers and uploads them as
#   workflow artifacts, so packaging is tested long before a release.
# - Pushing a tag like v0.1.0 (or v0.2.0-rc.1 for a pre-release) also publishes a GitHub release.
#   The tag must match the workspace version in Cargo.toml.
on:
  push:
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "packaging/**"
      - "assets/**"
      - "crates/buildinfo/**"
      - "apps/*/build.rs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      publish: ${{ steps.meta.outputs.publish }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        name: Read the version (and check the tag matches it)
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          publish=false
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match workspace version $version"
              exit 1
            fi
            publish=true
          fi
          prerelease=false
          case "$version" in *-*) prerelease=true ;; esac
          {
            echo "version=$version"
            echo "publish=$publish"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.target }}
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04, deb: amd64 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm, deb: arm64 }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, inno: x64 }
          - { target: aarch64-pc-windows-msvc, os: windows-11-arm, inno: arm64 }
          - { target: aarch64-apple-darwin, os: macos-latest }
          # Cross-compiled on Apple silicon; its smoke test is skipped because it cannot run there.
          - { target: x86_64-apple-darwin, os: macos-latest, cross: true }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      TARGET: ${{ matrix.target }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
          rustflags: ""
          cache-key: release-${{ matrix.target }}
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev desktop-file-utils appstream
      - name: Build
        run: cargo build --release --locked --target "$TARGET" -p tellshot-cli -p tellshot-editor

      - name: Stage files
        run: |
          ext=""; [[ "$TARGET" == *windows* ]] && ext=".exe"
          stage="dist/tellshot-$VERSION-$TARGET"
          mkdir -p "$stage"
          cp "target/$TARGET/release/tellshot$ext" "target/$TARGET/release/tellshot-editor$ext" "$stage/"
          cp README.md CHANGELOG.md LICENSE-MIT LICENSE-APACHE "$stage/"
          echo "STAGE=$stage" >> "$GITHUB_ENV"
          echo "EXT=$ext" >> "$GITHUB_ENV"

      - name: Smoke test
        if: ${{ !matrix.cross }}
        run: |
          cli="$STAGE/tellshot$EXT"
          "$cli" --version
          "$STAGE/tellshot-editor$EXT" --version
          "$cli" capture --backend synthetic --region 0,0,320,200 -o smoke.tellshot
          "$cli" edit smoke.tellshot --edit '{"op":"add","shape":{"kind":"arrow","from":{"x":10,"y":10},"to":{"x":200,"y":150}}}'
          "$cli" export smoke.tellshot -o smoke.png
          "$cli" --json describe smoke.tellshot

      - name: Archive
        run: |
          cd dist
          name="$(basename "$STAGE")"
          if [[ "$TARGET" == *windows* ]]; then
            7z a -tzip "$name.zip" "$name" > /dev/null
          else
            tar -czf "$name.tar.gz" "$name"
          fi

      - name: Debian package
        if: matrix.deb
        run: |
          root="$RUNNER_TEMP/deb"
          id=io.github.meetdhruva.Tellshot
          install -Dm755 "$STAGE/tellshot" "$root/usr/bin/tellshot"
          install -Dm755 "$STAGE/tellshot-editor" "$root/usr/bin/tellshot-editor"
          install -Dm644 "packaging/linux/$id.desktop" "$root/usr/share/applications/$id.desktop"
          install -Dm644 "packaging/linux/$id.metainfo.xml" "$root/usr/share/metainfo/$id.metainfo.xml"
          install -Dm644 "packaging/linux/$id.mime.xml" "$root/usr/share/mime/packages/$id.xml"
          for size in 16 22 24 32 48 64 128 256 512; do
            install -Dm644 "assets/icons/png/tellshot-$size.png" \
              "$root/usr/share/icons/hicolor/${size}x${size}/apps/$id.png"
          done
          install -Dm644 assets/icons/tellshot.svg "$root/usr/share/icons/hicolor/scalable/apps/$id.svg"
          comp="$RUNNER_TEMP/completions"
          mkdir -p "$comp"
          for shell in bash zsh fish; do "$STAGE/tellshot" completions "$shell" > "$comp/$shell"; done
          install -Dm644 "$comp/bash" "$root/usr/share/bash-completion/completions/tellshot"
          install -Dm644 "$comp/zsh" "$root/usr/share/zsh/vendor-completions/_tellshot"
          install -Dm644 "$comp/fish" "$root/usr/share/fish/vendor_completions.d/tellshot.fish"
          install -Dm644 README.md "$root/usr/share/doc/tellshot/README.md"
          {
            echo "Format: https://www.debian.org/doc/packaging-manuals/copyright-format/1.0/"
            echo "Upstream-Name: Tellshot"
            echo "Source: https://github.com/meetdhruva/tellshot"
            echo
            echo "Files: *"
            echo "Copyright: Tellshot contributors"
            echo "License: MIT or Apache-2.0"
          } > "$root/usr/share/doc/tellshot/copyright"
          mkdir -p "$root/DEBIAN"
          size=$(du -sk "$root/usr" | cut -f1)
          cat > "$root/DEBIAN/control" <<EOF
          Package: tellshot
          Version: $VERSION
          Architecture: ${{ matrix.deb }}
          Maintainer: Tellshot contributors <268780292+meetdhruva@users.noreply.github.com>
          Installed-Size: $size
          Depends: libc6 (>= 2.35), libfontconfig1, libxkbcommon0, libxkbcommon-x11-0
          Recommends: xdg-desktop-portal
          Section: graphics
          Priority: optional
          Homepage: https://github.com/meetdhruva/tellshot
          Description: Capture, annotate and share screenshots
           Tellshot is a fast, reliable and accessible screenshot tool with an editor,
           a command-line tool and an MCP server for AI agents.
          EOF
          desktop-file-validate "$root/usr/share/applications/$id.desktop"
          appstreamcli validate --no-net --explain "$root/usr/share/metainfo/$id.metainfo.xml"
          dpkg-deb --root-owner-group --build "$root" "dist/tellshot_${VERSION}_${{ matrix.deb }}.deb"
          sudo apt-get install -y "./dist/tellshot_${VERSION}_${{ matrix.deb }}.deb"
          tellshot --version
          dpkg -L tellshot

      - name: macOS app and disk image
        if: runner.os == 'macOS'
        run: |
          arch="${TARGET%%-*}"
          app="$RUNNER_TEMP/dmg/Tellshot.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp "$STAGE/tellshot-editor" "$STAGE/tellshot" "$app/Contents/MacOS/"
          cp assets/icons/tellshot.icns "$app/Contents/Resources/tellshot.icns"
          sed "s/@VERSION@/$VERSION/g" packaging/macos/Info.plist > "$app/Contents/Info.plist"
          plutil -lint "$app/Contents/Info.plist"
          # Ad-hoc signature: required for Apple silicon; not a Developer ID signature.
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict "$app"
          ln -s /Applications "$RUNNER_TEMP/dmg/Applications"
          hdiutil create -volname "Tellshot $VERSION" -srcfolder "$RUNNER_TEMP/dmg" -ov \
            -format UDZO "dist/Tellshot-$VERSION-$arch.dmg"
          hdiutil verify "dist/Tellshot-$VERSION-$arch.dmg"

      - name: Windows installer
        if: matrix.inno
        run: |
          choco install innosetup --no-progress -y
          cp assets/icons/tellshot.ico "$STAGE/"
          iscc="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          "$iscc" "/DAppVersion=$VERSION" "/DArch=${{ matrix.inno }}" \
            "/DSourceDir=$(cygpath -w "$PWD/$STAGE")" "/DOutputDir=$(cygpath -w "$PWD/dist")" \
            packaging/windows/tellshot.iss
          rm "$STAGE/tellshot.ico"

      - name: Collect
        run: |
          rm -rf "$STAGE"
          ls -la dist

      - name: Attest build provenance
        if: needs.plan.outputs.publish == 'true'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: tellshot-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [plan, build]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          cat docs/install.md >> notes.md
      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.plan.outputs.version }}
          PRERELEASE: ${{ needs.plan.outputs.prerelease }}
        run: |
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" dist/* --title "Tellshot $VERSION" \
              --notes-file notes.md --verify-tag "${flags[@]}"
          fi
