name: Bug report
description: Something does not work as expected
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please do not attach screenshots that contain private information.
        Security problems go to the [private advisory form](https://github.com/meetdhruva/tellshot/security/advisories/new) instead.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `tellshot capture --backend synthetic -o shot.tellshot`
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Tellshot version
      placeholder: output of `tellshot --version`
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux (X11)
        - Linux (Wayland)
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or error output
      description: Run with `TELLSHOT_LOG=debug` for more detail.
      render: text
