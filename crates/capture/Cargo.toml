[package]
name = "tellshot-capture"
description = "Screen capture for Tellshot behind one trait: X11, Windows and macOS backends, plus a synthetic backend for tests and agents."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
keywords = ["screenshot", "screen-capture", "x11"]
categories = ["multimedia::images", "os"]

[dependencies]
tellshot-imaging = { workspace = true }
thiserror = { workspace = true, features = ["std"] }
serde = { workspace = true, features = ["std"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
x11rb = { workspace = true }

# Interim backend until native Windows.Graphics.Capture and ScreenCaptureKit adapters land
# (ADR 0004). It sits behind the same trait, so replacing it touches only this crate.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
xcap = { workspace = true }

[target.'cfg(all(unix, not(target_os = "macos")))'.dev-dependencies]
x11rb = { workspace = true }

[lints]
workspace = true
