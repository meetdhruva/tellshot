[package]
name = "tellshot-format"
description = "Tellshot file I/O: crash-safe atomic writes, PNG codec and the versioned .tellshot project format."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
keywords = ["file-format", "png", "screenshot"]
categories = ["encoding", "filesystem"]

[dependencies]
tellshot-core = { workspace = true }
tellshot-imaging = { workspace = true }
serde = { workspace = true, features = ["std"] }
serde_json = { workspace = true }
png = { workspace = true }
zip = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true, features = ["std"] }


[lints]
workspace = true
